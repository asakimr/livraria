services:
  app:
    image: serversideup/php:8.3-cli
    container_name: livraria_app
    volumes:
      - .:/var/www/html
    ports:
      - "8777:8777"
    # Inicia o artisan serve acessível de fora do container
    command: php artisan serve --host=0.0.0.0 --port=8777
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: livraria_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
