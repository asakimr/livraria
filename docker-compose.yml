services:
  app:
    build:
     context: .
     dockerfile: Dockerfile
    container_name: livraria_app
    user: "1000:1000"
    userns_mode: keep-id
    volumes:
      - .:/var/www/html:z
    ports:
      - "8777:8777"
    # Inicia o artisan serve acessível de fora do container
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - PUID=1000
      - PGID=1000
      - PHP_EXTENSIONS=intl
      
    depends_on:
      - db
    command: >
      sh -c "composer install --no-interaction &&
             php artisan key:generate --force &&
             php artisan serve --host=0.0.0.0 --port=8777"

  db:
    image: mysql:8.0
    container_name: livraria_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
  node:
    image: node:20-alpine
    container_name: livraria_node
    user: "1000:1000"
    userns_mode: keep-id
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:z
    ports:
      - "5173:5173" # Porta padrão do Vite
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  db_data:
