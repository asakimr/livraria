name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: livraria_test
          MYSQL_USER: livraria_test
          MYSQL_PASSWORD: test_only
          MYSQL_ROOT_PASSWORD: root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: intl, mbstring, pdo_sqlite, pdo_mysql, dom

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'mysql' && 'livraria_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: livraria_test
          DB_PASSWORD: test_only
          DB_URL: ''
